name: avito-kitchen

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: kitchen
      POSTGRES_DB: kitchen
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen -d kitchen"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  kitchen:
    build:
      context: .
      dockerfile: build/Dockerfile
      args:
        TARGET: kitchen
        VERSION: ${APP_VERSION:-dev}
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      DATABASE_DSN: "postgres://kitchen:kitchen@postgres:5432/kitchen?sslmode=disable"
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      DATABASE_AUTO_MIGRATE: ${DATABASE_AUTO_MIGRATE:-true}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  partner-demo:
    build:
      context: .
      dockerfile: build/Dockerfile
      args:
        TARGET: partner-demo
        VERSION: ${APP_VERSION:-dev}
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      HTTP_ADDR: ":8081"
      KITCHEN_GRPC_ADDR: "kitchen:9090"
      PARTNER_API_KEY: ${PARTNER_API_KEY:-demo-hinkalnaya-6f3a1c9d4b2e8a70}
      PARTNER_SYNC_MENU: "true"
      PARTNER_AUTO_ACCEPT: ${PARTNER_AUTO_ACCEPT:-true}
      PARTNER_PREP_MINUTES: ${PARTNER_PREP_MINUTES:-25}
      PARTNER_ACCEPT_DELAY: ${PARTNER_ACCEPT_DELAY:-3s}
      PARTNER_COOKING_DELAY: ${PARTNER_COOKING_DELAY:-5s}
      PARTNER_READY_DELAY: ${PARTNER_READY_DELAY:-10s}
      PARTNER_DISPATCH_DELAY: ${PARTNER_DISPATCH_DELAY:-5s}
      PARTNER_DELIVERY_DELAY: ${PARTNER_DELIVERY_DELAY:-15s}
      PARTNER_RESTOCK_INTERVAL: ${PARTNER_RESTOCK_INTERVAL:-2m}
      PARTNER_RESTOCK_TO: ${PARTNER_RESTOCK_TO:-20}
    ports:
      - "8081:8081"
    depends_on:
      kitchen:
        condition: service_healthy
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    environment:
      URLS: '[{"url":"http://localhost:8080/openapi.json","name":"API Кухни"}]'
      DEEP_LINKING: "true"
    ports:
      - "8088:8080"
    depends_on:
      kitchen:
        condition: service_started

volumes:
  postgres-data:
