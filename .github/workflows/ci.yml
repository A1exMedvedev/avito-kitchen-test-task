name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kitchen
          POSTGRES_PASSWORD: kitchen
          POSTGRES_DB: kitchen
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U kitchen -d kitchen"
          --health-interval 2s --health-timeout 3s --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: go-task/setup-task@v1
        with:
          version: 3.x

      - name: Install the pinned generators
        run: task tools

      - name: Generate from the contracts and build
        run: task generate:clean

      - name: Lint the proto contracts
        run: easyp lint --root api/proto --path .

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.6.2

      - name: Unit tests
        run: task test

      - name: Integration tests
        run: go test -tags integration -race -count=1 ./test/...
        env:
          TEST_DATABASE_DSN: postgres://kitchen:kitchen@localhost:5433/kitchen?sslmode=disable

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bring the stack up and walk every scenario
        run: |
          docker compose up --build -d
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/readyz >/dev/null 2>&1 && break
            sleep 2
          done
          ./scripts/demo.sh

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
